<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: url("https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg?auto=compress&cs=tinysrgb&w=1600")
        center/cover no-repeat fixed;
      padding: 20px;
      color: #ffffff;
    }

    h1 {
      text-align: center;
      color: #ffeb3b;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
      margin-bottom: 25px;
    }

    .filters {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .filters select,
    .filters input {
      padding: 8px 12px;
      border-radius: 5px;
      border: none;
      font-family: "Poppins", sans-serif;
      font-size: 14px;
    }

    .events {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(130, 132, 235, 0.92);
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      color: #2c3e50;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      color: #1a237e;
      margin-bottom: 10px;
    }

    .card p {
      color: #37474f;
      margin: 4px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>Event Dashboard</h1>

  <!-- Filters -->
  <div class="filters">
    <select id="categoryFilter">
      <option value="All">All Categories</option>
      <option value="Technology">Technology</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Arts">Arts</option>
    </select>

    <input type="date" id="dateFilter" />
  </div>

  <!-- Event Cards -->
  <div class="events" id="eventContainer"></div>

  <script>
    const mockEvents = [
      {
        id: 1,
        title: "Symposium",
        category: "Technology",
        date: "2026-01-15",
        location: "Andra"
      },
      {
        id: 2,
        title: "Birthday",
        category: "Entertainment",
        date: "2026-02-10",
        location: "Delhi"
      },
      {
        id: 3,
        title: "Culturals",
        category: "Arts",
        date: "2026-03-30",
        location: "Chennai"
      }
    ];

    const eventContainer = document.getElementById("eventContainer");
    const categoryFilter = document.getElementById("categoryFilter");
    const dateFilter = document.getElementById("dateFilter");

    let allEvents = [];

    const fetchEvents = async () => {
      return new Promise(resolve => {
        setTimeout(() => {
          resolve(mockEvents);
        }, 500);
      });
    };

    const renderEvents = (events) => {
      eventContainer.innerHTML = "";

      events.forEach(({ title, category, date, location }) => {
        eventContainer.innerHTML += `
          <div class="card">
            <h3>${title}</h3>
            <p><strong>Category:</strong> ${category}</p>
            <p><strong>Date:</strong> ${date}</p>
            <p><strong>Location:</strong> ${location}</p>
          </div>
        `;
      });
    };

    const applyFilters = () => {
      const selectedCategory = categoryFilter.value;
      const selectedDate = dateFilter.value;

      const filteredEvents = allEvents.filter(event => {
        const categoryMatch =
          selectedCategory === "All" || event.category === selectedCategory;
        const dateMatch =
          !selectedDate || event.date === selectedDate;
        return categoryMatch && dateMatch;
      });

      renderEvents(filteredEvents);
    };

    categoryFilter.addEventListener("change", applyFilters);
    dateFilter.addEventListener("change", applyFilters);

    fetchEvents().then(data => {
      allEvents = data;
      renderEvents(allEvents);
    });
  </script>

</body>
</html>
